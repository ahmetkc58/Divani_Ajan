[project]
name = "orneksehir-evrak-backend"
version = "0.1.0"
description = "Kamu evrak ve yazışma süreçleri için yerel Ollama destekli karar destek API'si"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "numpy>=1.26,<3",
  "pillow>=10,<12",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "pymupdf>=1.24,<2",
  "pytesseract>=0.3.13,<1",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.9,<1",
  "reportlab>=4.2,<5",
  "uvicorn[standard]>=0.30,<1"
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]
