services:
  backend:
    image: evrakai-backend:local
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_PROJECT_ROOT: /workspace
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      APP_CORS_ORIGINS: http://localhost:5173,http://localhost:8080
      APP_MAX_UPLOAD_MB: 10
      APP_MAX_PDF_PAGES: 20
      APP_JOB_TIMEOUT_SECONDS: 180
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./runtime:/workspace/runtime
      - ./data:/workspace/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  frontend:
    image: evrakai-frontend:local
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    restart: unless-stopped
